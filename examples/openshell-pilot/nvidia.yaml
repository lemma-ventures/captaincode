id: captain-nim-pilot
display_name: Captain NIM pilot
category: inference
inference_capable: true
credentials:
  - name: api_key
    env_vars: [NVIDIA_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: integrate.api.nvidia.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow:
          method: POST
          path: /v1/chat/completions
binaries: [/usr/local/bin/opencode, /usr/bin/curl]
